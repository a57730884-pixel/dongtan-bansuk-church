<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교회 소식 | 동탄반석교회</title>
  <meta name="description" content="동탄반석교회 공지사항, 앨범, 문의" />
  <meta name="theme-color" content="#0f7bb5" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body>

  <section class="page-hero">
    <div class="ph-inner">
      <p class="ph-eyebrow">NEWS</p>
      <h1>교회 소식</h1>
      <p>공지사항과 행사 사진을 한곳에서 봅니다.</p>
    </div>
  </section>

  <section class="block" id="notice">
    <div class="container">
      <div class="sec-head">
        <div><h2>공지사항</h2></div>
        <!-- 최고관리자로 로그인하면 여기에 공지 올리기 단추가 붙습니다(js/notices.js) -->
        <div class="sec-actions" id="noticeActions"></div>
      </div>
      <div class="list" id="noticeList"><p class="qt-loading">불러오는 중…</p></div>
    </div>
  </section>

  <section class="block alt" id="album">
    <div class="container">
      <div class="sec-head">
        <div>
          <h2>앨범</h2>
          <p>성도 누구나 사진을 올려 함께 봅니다. 사진을 누르면 크게 넘겨 보실 수 있습니다.</p>
        </div>
        <div class="sec-actions">
          <button type="button" class="admin-btn primary" id="albumUpload">＋ 사진 올리기</button>
        </div>
      </div>
      <div class="al-grid" id="albumGrid"><p class="qt-loading" style="grid-column:1/-1">불러오는 중…</p></div>
    </div>
  </section>

  <section class="block" id="contact">
    <div class="container">
      <div class="sec-head"><div>
        <h2>문의 · 새가족 등록</h2>
        <p>처음 오시는 분, 등록을 원하시는 분은 편하게 연락 주세요.</p>
      </div></div>
      <div class="info-grid">
        <div class="info-box"><h3>전화</h3><p style="color:var(--ink-soft)">교회 대표 번호를 넣어 주세요</p></div>
        <div class="info-box"><h3>주소</h3><p class="addr-road">경기 화성시 동탄구 동탄지성로 84</p><p class="addr-jibun">지번 · 동탄구 반송동 42-8</p><p style="margin:12px 0 0"><a class="more" href="about.html#directions">지도 보기</a></p></div>
        <div class="info-box"><h3>새가족 등록</h3><p style="color:var(--ink-soft)">주일 예배 후 1층 안내석에서 도와드립니다.</p></div>
      </div>
    </div>
  </section>

  <script src="js/config.js?v=11"></script>
  <script src="js/layout.js?v=11"></script>
  <script src="js/upload.js?v=11"></script>
  <script src="js/content.js?v=11"></script>
  <script src="js/notices.js?v=11"></script>
  <script src="js/album.js?v=11"></script>
</body>
</html>
