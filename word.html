<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>말씀 | 동탄반석교회</title>
  <meta name="description" content="동탄반석교회 주일 설교와 설교 아카이브, 주보" />
  <meta name="theme-color" content="#0f7bb5" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=14" />
</head>
<body>

  <section class="page-hero">
    <div class="ph-inner">
      <p class="ph-eyebrow">WORD</p>
      <h1>말씀</h1>
      <p>남기고 싶은 설교가 사라지지 않도록, 유튜브에 올리고 이곳에 모읍니다.</p>
    </div>
  </section>

  <!-- 이번 주 설교 -->
  <section class="block" id="this">
    <div class="container">
      <div class="sec-head">
        <div><h2>이번 주 설교</h2></div>
        <!-- 최고관리자로 로그인하면 여기에 설교 추가 버튼이 붙습니다(js/content.js) -->
        <div class="sec-actions" id="thisActions"></div>
      </div>
      <!-- 설교는 데이터베이스(sermons)에서 옵니다 -->
      <div id="featuredRoot"><p class="qt-loading">불러오는 중…</p></div>
    </div>
  </section>

  <!-- 설교 아카이브 -->
  <section class="block alt" id="archive">
    <div class="container">
      <div class="sec-head"><div>
        <h2>설교 아카이브</h2>
        <p>지난 설교가 이곳에 쌓입니다. 카드를 누르면 유튜브에서 바로 재생됩니다.</p>
      </div></div>
      <div class="cards" id="archiveRoot"><p class="qt-loading">불러오는 중…</p></div>
    </div>
  </section>

  <!-- 주보 -->
  <section class="block" id="bulletin">
    <div class="container">
      <div class="sec-head"><div>
        <h2>주보</h2>
        <p>주일 주보를 PDF로 올려 두면 언제든 열어 볼 수 있습니다.</p>
      </div></div>
      <div class="list">
        <div class="list-item"><span class="li-tag">주보</span><span class="li-title">2026년 9월 둘째 주 주보</span><span class="li-date">2026.09.13</span></div>
        <div class="list-item"><span class="li-tag">주보</span><span class="li-title">2026년 9월 첫째 주 주보</span><span class="li-date">2026.09.06</span></div>
        <div class="list-item"><span class="li-tag">주보</span><span class="li-title">2026년 8월 마지막 주 주보</span><span class="li-date">2026.08.30</span></div>
      </div>
    </div>
  </section>

  <script src="js/config.js?v=14"></script>
  <script src="js/layout.js?v=14"></script>
  <script src="js/content.js?v=14"></script>
