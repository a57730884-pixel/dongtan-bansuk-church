<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 재설정 | 동탄반석교회</title>
  <meta name="theme-color" content="#0f7bb5" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=13" />
</head>
<body>
  <section class="page-hero">
    <div class="ph-inner">
      <p class="ph-eyebrow">RESET</p>
      <h1>비밀번호 재설정</h1>
      <p>메일로 받은 링크로 들어오셨다면 새 비밀번호를 정해 주세요.</p>
    </div>
  </section>

  <section class="block">
    <div class="container" style="max-width:460px">
      <form class="form-card" id="resetForm">
        <div class="form-field"><label>새 비밀번호 (8자 이상)</label><input type="password" id="pw1" minlength="8" required /></div>
        <div class="form-field" style="margin-top:14px"><label>새 비밀번호 확인</label><input type="password" id="pw2" minlength="8" required /></div>
        <div class="form-actions" style="margin-top:18px"><button class="btn btn-solid" type="submit">변경하기</button>
          <span class="profile-msg" id="resetMsg"></span></div>
      </form>
    </div>
  </section>

  <script src="js/config.js?v=13"></script>
  <script src="js/layout.js?v=13"></script>
  <script>
    // auth.js 가 Supabase 클라이언트를 만든 뒤('sb-ready') 동작합니다.
    window.addEventListener('sb-ready', function (e) {
      var sb = e.detail.sb, form = document.getElementById('resetForm'), out = document.getElementById('resetMsg');
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
        if (a !== b) { out.textContent = '두 비밀번호가 서로 다릅니다.'; return; }
        out.textContent = '변경 중…';
        sb.auth.updateUser({ password: a }).then(function (r) {
          if (r.error) { out.textContent = '오류: ' + r.error.message; return; }
          out.textContent = '변경되었습니다. 새 비밀번호로 로그인해 주세요.';
          setTimeout(function () { location.href = 'index.html'; }, 1500);
        });
      });
    });
  </script>
</body>
</html>
