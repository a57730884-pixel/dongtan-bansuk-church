<body>

  <section class="page-hero">
    <div class="ph-inner">
      <p class="ph-eyebrow">DAILY DEVOTION</p>

  <section class="block" id="today">
    <div class="container" style="max-width:900px">

  <!-- 지난 큐티 — 제목·성경 본문·본문 속 낱말로 찾습니다(js/qt.js) -->

    <div class="container" style="max-width:900px">
      <div class="sec-head"><div>
        <h2>지난 큐티</h2>
        <p>제목이든, 성경 본문이든, 큐티 글 속의 한 낱말이든 — 기억나는 대로 적어 찾을 수 있습니다.</p>
      </div></div>
      <div id="qtList"></div>
    </div>
  </section>

  <script src="js/config.js?v=23"></script>
